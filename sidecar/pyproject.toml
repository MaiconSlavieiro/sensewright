[project]
name = "sensewright-sidecar"
version = "0.1.0"
description = "Sensewright sidecar — FastAPI orchestration host for The Sims 4 LLM mod"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
sensewright-sidecar = "sensewright_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sensewright_sidecar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The sidecar must degrade gracefully, so broad excepts and pass blocks are
# intentional design choices (never crash the host because one subsystem failed).
ignore = ["BLE001", "S110", "S112"]
