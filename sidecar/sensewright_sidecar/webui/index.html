<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensewright — Web Panel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <header id="top">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <h1 data-i18n="web.title">Sensewright — Web Panel</h1>
        <p id="subtitle" data-i18n="web.subtitle"></p>
      </div>
    </div>
    <div class="conn">
      <span id="connDot" class="dot"></span>
      <span id="connText">…</span>
      <span id="version" class="version"></span>
    </div>
  </header>

  <div id="tokenBar" class="tokenbar hidden">
    <strong data-i18n="web.token.title"></strong>
    <span data-i18n="web.token.hint"></span>
    <input id="tokenInput" type="password" autocomplete="off" placeholder="token">
    <button id="tokenSave" data-i18n="web.token.save"></button>
  </div>

  <nav id="tabs">
    <button data-tab="status" class="active" data-i18n="web.tab.status"></button>
    <button data-tab="controls" data-i18n="web.tab.controls"></button>
    <button data-tab="roster" data-i18n="web.tab.roster"></button>
    <button data-tab="world" data-i18n="web.tab.world"></button>
    <button data-tab="pending" data-i18n="web.tab.pending"></button>
  </nav>

  <main id="view">
    <div class="loading" data-i18n="web.loading">Loading…</div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/ui/app.js" defer></script>
</body>
</html>
