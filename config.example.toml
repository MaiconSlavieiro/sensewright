# ─── Sensewright — config.toml (example) ────────────────────────────────
# Copy to <Mods>/Sensewright/sidecar/config.toml and fill in only the keys
# you want. With NO KEYS AT ALL the mod already runs in "native mode".

[ui]
# Player-facing language for in-game text: "auto" or any locale code present in
# the locale manifest (shipped: en, pt-BR). "auto" follows the game language and
# falls back to the default. The set of languages is data-driven: adding one is a
# JSON file + a manifest entry, never a code change (see the mod's locales/).
language = "auto"
# Serve the built-in browser panel at http://<host>:<port>/ so you can watch and
# configure the sidecar from a browser in parallel with the game. Set to false to
# hide it (recommended when host = "0.0.0.0").
web_panel = true

[network]
host = "127.0.0.1"
port = 8765

[logging]
level = "INFO"
file = "data/sidecar.log"
audit = "data/audit.log"

# ─── LLM ──────────────────────────────────────────────────────────────
[llm]
# Fallback order among enabled providers. Providers without a key (or disabled
# ones) are skipped, so it is safe to list more than you have configured.
# OpenRouter leads (most stable free tier); local Ollama comes next for offline
# use; Gemini is late because its free tier rate-limits hard; paid DeepSeek is
# the absolute last resort. Providers that are disabled here are simply skipped.
chain = ["openrouter", "opencode", "ollama", "groq", "gemini", "deepseek"]
budget_per_sim_per_day = 500
# How much hidden reasoning a model may spend before its visible answer:
# none | minimal | low | medium | high ("off"/"" = leave it to the model).
# Defaults to "none": agent impulses are a single short line, and reasoning
# models otherwise burn the whole output budget on a hidden "thinking process"
# (truncating the answer). The per-agent override below wins.
reasoning_effort = "none"
# v0.4 P2: post-generation language guard. "strict" retries once with a
# reinforced directive, then falls back to a deterministic localized line;
# "off" records the mismatch without retrying.
language_policy = "strict"
# v0.5 R2: dynamically discover free models via each provider's GET /models and
# add them to the pool (Zen: *-free slugs; OpenRouter: :free ids). 0 disables it.
# When a configured model is in cool-down it is swapped for a discovered free
# model of the same provider (never on an auth error). Refresh interval below;
# a refresh is also forced on demand when a whole call fails.
model_refresh_minutes = 30.0
auto_swap_models = true
# v0.5 A3: minimum seconds between two failure-triggered pool refreshes. Stops a
# persistently failing chain from hammering GET /models + retrying on every
# request. The periodic refresh above is unaffected. 0 disables the throttle.
refresh_on_failure_min_seconds = 60.0
# Optional per-purpose model override (wins over the "fast models first"
# heuristic used for short tasks like social/summary):
# [llm.task_models]
# social  = ["nvidia/nemotron-3.5-lightning:free", "mimo-v2.6-flash-free"]
# summary = ["nvidia/nemotron-3.5-lightning:free"]

# `rpm`/`rpd` are the provider's real limits (requests/minute and requests/day).
# When set, the chain skips a provider that would exceed them and falls through
# to the next one instead of burning a 429. Omit them (or 0) to disable. Each
# provider also tries its own `model`/`models` in order before the chain moves on.
[llm.providers.openrouter]
enabled = true
# Order matters: the first model that answers is used. The two below emit native
# tool calls reliably; `nemotron-3.5-lightning` often spends its whole budget on
# hidden reasoning and is skipped automatically when it truncates.
models = ["nvidia/nemotron-3-ultra-550b-a55b:free", "nvidia/nemotron-3-super-120b-a12b:free", "nvidia/nemotron-3.5-lightning:free", "google/gemma-4-31b-it:free"]
api_key = "${OPENROUTER_API_KEY}"
base_url = "https://openrouter.ai/api/v1"
# Hard billing guard: only ids containing ":free" are ever called, so a
# misconfigured list can never fall back to a paid model.
free_only = true
# Accepts the OpenAI-compatible `reasoning` parameter, so the per-agent effort
# is forwarded as `reasoning.effort` on each request.
supports_reasoning = true
rpm = 20
# v0.5 A1: the account's real free-model daily limit (GET /api/v1/key ->
# free_model_daily_requests) is 1000 with a one-time $10 credit, so the local
# meter must not self-block at 50. Set 0 to disable the daily cap entirely.
rpd = 1000
# v0.5 R1: after `model_failure_threshold` (default 2) consecutive empty/error
# answers a model is retired for this many seconds; a success resets it. This
# stops an unstable model from being retried on every request.
model_cooldown_seconds = 120
# model_failure_threshold = 2

# OpenCode Zen gateway (OpenAI-compatible, Bearer token). Optional power tier:
# it needs an OpenCode Zen API key (https://opencode.ai/auth). IMPORTANT: Zen's
# free tier is restricted to the OpenCode client (HTTP 403 "free tier can only
# be used from within OpenCode"), so most *-free slugs DO NOT work from the
# sidecar. The exception validated here is `space-bunny-free`. Paid Zen models
# work but are billed.
[llm.providers.opencode]
enabled = false
models = ["space-bunny-free"]
api_key = "${OPENCODE_API_KEY}"
base_url = "https://opencode.ai/zen/v1"
# v0.5 A4: Zen's GET /models free slugs 403 outside the OpenCode client, so its
# dynamic discovery is disabled (it only adds models that never answer).
discover_models = false
# rpm = 20
# rpd = 200

# Google AI Studio (free tier; rate-limits hard). 2.5-era models are retired for
# new accounts, so the free picks are the flash-lite family (small/fast first).
# Limits below are deliberately conservative to stay inside the free tier —
# check your real ones at https://aistudio.google.com (Rate limits).
[llm.providers.gemini]
enabled = true
models = ["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-3.1-flash-lite", "gemini-3.5-flash"]
api_key = "${GEMINI_API_KEY}"
rpm = 10
rpd = 250
# Gemini 3.x rejects thinkingBudget=0 (HTTP 400); leave unset. Set 0 only for
# 2.5-era models that accept it.
# thinking_budget = 0

# v0.5 A5/A6: any OpenAI-compatible endpoint can be plugged in without code by
# setting `type = "openai_compat"` + `base_url`. Groq/Cerebras are fast free
# tiers; Ollama runs fully local. `api_key_optional = true` allows no key.
[llm.providers.groq]            # v0.5 A9: fast free tier (optional)
enabled = false
type = "openai_compat"
# Free-tier chat models (small/fast first). Groq's catalog rotates; check
# https://console.groq.com/docs/models if one is retired.
models = ["openai/gpt-oss-20b", "qwen/qwen3.8-27b", "openai/gpt-oss-120b"]
api_key = "${GROQ_API_KEY}"
base_url = "https://api.groq.com/openai/v1"
rpm = 30
rpd = 1000

[llm.providers.ollama]          # v0.5 A7: local, free, offline last resort
enabled = false                 # enable after installing Ollama + the model
type = "openai_compat"          # v0.5 A5: config-driven generic provider
model = "granite4.1:8b"
api_key = ""                    # v0.5 A6: local endpoints need no key
api_key_optional = true
base_url = "http://localhost:11434/v1"
# v0.5 A7: keep the model from spending its budget on hidden reasoning.
extra_body = { reasoning_effort = "none" }

[llm.providers.deepseek]        # v0.5 A8: paid, absolute last resort
enabled = false                 # enable when the free tiers are not enough
# Current paid ids (validated 2026-10-01): deepseek-flash (V4.1-Flash) and
# deepseek-v4-pro.
models = ["deepseek-flash", "deepseek-v4-pro"]
api_key = "${DEEPSEEK_API_KEY}"
base_url = "https://api.deepseek.com/v1"

# ─── MEMORY ───────────────────────────────────────────────────────────
[memory]
provider = "sqlite"
embedding_provider = "none"      # none | cloudflare (BGE-M3 free)
retention_days = 180
# v0.2 M1: consolidate raw chat turns into one memory after a silence window
# (`dialogue_idle_seconds`). Raw turns are archived, never deleted.
consolidation_enabled = true
dialogue_idle_seconds = 300.0
# v0.2 M2: graded forgetting. `strength` decays lazily; used memories are
# touched back up; forgotten ones can resurface as déjà vu.
decay_preset = "normal"          # fast | normal | slow
weaken_threshold = 0.5
forget_threshold = 0.2
dejavu_chance = 0.05

# Credentials for the embedding provider (only needed for "cloudflare").
[memory.embedding_provider_config]
# account_id = "..."
# api_token = "..."

# ─── AGENTS ───────────────────────────────────────────────────────────
[agents]
# `agent_seats` is the v0.3 agent-seat pool (how many Sims may hold a live
# agent at once; active household first, then instanced visitors). It overrides
# the legacy `max_active` when set.
agent_seats = 6
max_active = 6                   # legacy alias for agent_seats
evolution_speed = "normal"       # slow | normal | fast
autonomy_default = "semi"        # off | observe | suggest | semi | full
# Safety rails (Phase 2): cap directive tool calls per Sim and hold off after
# the player acts, so the AI never fights the player for control.
tool_calls_per_minute = 10
player_lock_seconds = 10.0

# Reflection/evolution loop (Phase 4): compress events into reflections and
# drift personality. `trait_swap`: off | propose | auto.
[agents.evolution]
enabled = true
min_events = 8
cooldown_seconds = 900.0
max_reflections_per_day = 24
trait_swap = "propose"
drift_strength = 0.2

# v0.2 A2/A3: per-Sim initiative loop. `level`: minimal | moderate | full;
# the player's own Sim gets its own (usually lower) `player_sim_level`.
[agents.initiative]
level = "full"
player_sim_level = "suggest"
cooldown_sim_minutes = 8.0
event_react_threshold = 1.0
spontaneous_lines = true
quota_fraction = 0.8             # target fraction of the free-tier RPM
max_impulses_per_tick = 1
# v0.3 §15.6: impulse/thought frequency dials. 0 = sleep-only. The agent-roster
# panel (`sw.agents`) adjusts these live; a per-Sim override wins.
# v0.5 A10: lowered to stretch the free-tier daily quota over a longer session.
impulse_frequency = 0.1
# The player's own household Sims are inhabited too (nonzero by default); the
# mod's player-priority lock still keeps the player in control.
player_sim_impulse_frequency = 0.1
# Salient event reactions stay on independently of the impulse dial.
reactions_enabled = true
# v0.5 R3: fraction of the shared per-minute LLM budget kept for social
# conversation turns. Social may spend the full budget (reserve included); idle
# impulses may only use the remainder, so an ongoing conversation is never
# starved by idle chatter on a busy free tier.
social_reserve_fraction = 0.4
# Per-agent hidden-reasoning budget for impulses: none|minimal|low|medium|high.
# Omit/None to inherit [llm] reasoning_effort ("none").
# reasoning_effort = "none"

# v0.2 P1: living personality — psyche blocks + life story, consolidated
# during sleep, with intensity decaying unless reinforced.
[agents.personality]
absorption_enabled = true
salience_threshold = 1.5
max_traumas = 5
max_beliefs = 10
trauma_decay = "slow"            # fast | normal | slow
sleep_consolidation = true

# v0.3 §15.11: per-layer enable toggles. A disabled layer degrades to the
# native deterministic path instead of running an LLM call.
[agents.layers]
memory = true
cognition = true
social = true

# v0.3 R5: sim<->sim dialogue channel. Two seated, non-player Sims may exchange
# a short (1-2 line) conversation per zone pulse; the spoken lines reach the
# game through the normal intent pull, and a per-pair cooldown avoids repeats.
[agents.social]
max_pairs_per_tick = 1
pair_cooldown_seconds = 180.0
# v0.3 R5 fix: a dialogue only happens while the two Sims are in a *real*
# native conversation with each other (mutually targeting) and physically
# close, so agents never talk "telepathically" across the lot. Set
# `require_conversation = false` to restore the old distance-agnostic behavior.
require_conversation = true
# Max lot-space distance between the pair (from the pulse `location` "x,y").
max_pair_distance = 4.0
# v0.4 P6: only pair Sims that share a room (engine room id from the pulse;
# 0 = outside). Unknown rooms degrade to the distance gate. Stops agents from
# talking through walls.
require_same_room = true
# v0.4 P6: keep a conversation open while the pulse queue still holds an
# interaction with the same Sim, instead of closing with a premature "goodbye".
keep_open_on_queued = true
line_max_tokens = 200
# v0.5 R3: a new dialogue turn only when the pair's interaction/queue changed, or
# after this many seconds of an open conversation. Prevents the same line from
# being re-rendered on every zone pulse. 0 = turn on any pulse while active.
turn_min_interval_seconds = 25.0

# v0.4 P1: speech policy — the end of the random idle monologue. Idle impulses
# only think (internal) or act; speech comes from a conversation session, a
# reaction with a target, or player chat. A discreet murmur is occasional.
[agents.speech]
min_interval_between_lines = 30.0   # seconds between surfaced lines per Sim
max_lines_per_minute = 12           # global ceiling across all Sims
ambient_talk_chance = 0.08          # odds a devaneio (murmur) surfaces
murmur_cooldown_seconds = 120.0
notify_thoughts = true              # surface discreet devaneios at all
hearing_radius = 20.0               # notify only near the active Sim; 0 = always

# v0.4 P3: presence policy — visitors/passers-by are reactive by default, so
# they no longer comment on the household's home. `visitor`: reactive | full | off.
[agents.presence]
visitor = "reactive"
familiar_friendship = 20.0

# v0.4 P4/P4b: conversation sessions. Two Sims already in a native conversation
# hold a multi-turn exchange (1 LLM call per pulse), with a closing summary.
[agents.conversations]
enabled = true
max_turns = 4
max_tokens = 220
summary_enabled = true
leaving_summary = true
idle_seconds = 90.0

# ─── RUNTIME ──────────────────────────────────────────────────────────
[runtime]
# Expose the live agent roster + dials to the mod panel (`sw.agents`).
expose_roster = true
# Lifecycle: shut the sidecar down when The Sims 4 exits, so it never lingers
# after the game closes. The mod passes its own PID via SENSEWRIGHT_GAME_PID when
# it spawns the sidecar; `game_pid` is a manual override. If the sidecar was
# already running, the mod arms it at boot through POST /v1/lifecycle/attach.
shutdown_on_game_exit = true
# game_pid = 1234
# Fallback: watch by process name (off by default; can false-positive in dev).
watch_game_process_name = false
game_process_name = "TS4_x64.exe"
game_watch_interval_seconds = 2.0
game_watch_grace_seconds = 5.0

# ─── GOD ──────────────────────────────────────────────────────────────
# Defaults only. The neighborhood zeitgeist and per-save overrides live in the
# sidecar SQLite (neighborhoods table), keyed by save_id. See GET /v1/god/controls
# for the full ControlSpec registry.
[god]
enabled = false
preset = "novela"                # novela | sitcom | drama | caos | terror | romance | filme_adolescente
intervention_frequency = 0.5     # 0..1
intensity = 0.5                  # 0..1
mood_influence = 0.5             # 0..1  zeitgeist influence over backgrounds/mood
autonomy_degree = 0.5            # 0..1
chaos_degree = 0.3               # 0..1
# Slowest cadence between two God interventions (seconds). The frequency and
# autonomy dials shorten it down to a 30 s floor (Phase 5c orchestration).
base_interval_seconds = 600.0
# Inline tables must stay on one line in TOML 1.0.
powers = { spawn_npc = true, apply_trait = true, force_social = true, gossip = true, relationship_shift = true, extreme_events = false }

# Free-form ControlSpec-validated overrides.
[god.settings]
evolution_speed = "normal"       # slow | normal | fast

# Progressive background pipeline (Phase 5b): writes Sim/household backgrounds
# off the request path on the free tier, active-zone first, then related NPCs.
# Its budgeter is separate from the chat path so it never steals a chat slot.
[god.backgrounds]
enabled = true
batch_size = 2                   # jobs per tick
interval_seconds = 15.0          # pause between non-empty ticks
idle_seconds = 30.0              # pause when the queue is empty
# v0.5 A10: lower caps to leave more of the shared free-tier quota for chat and
# social conversation turns.
per_minute = 3                   # burst cap (0 = unlimited)
daily_limit = 60                 # background generations per day (0 = unlimited)
max_queue = 200                  # queued job cap
max_attempts = 2                 # retries per job before giving up
